name: Cambodia CPI Pipeline CI/CD

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint & Code Quality ──────────────────────────────────────────────────
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint (Syntax & Critical Checks)
        run: |
          ruff check --select=E9,F63,F7,F82,F401,F841 --ignore=E501,EXE002,W292 pipeline scrapers orchestration tests scripts apps

  # ── 2. Full Pytest Test Suite (with PostgreSQL 16 Service) ──────────────────
  test-suite:
    name: Pytest Unit & Integration Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpi_user
          POSTGRES_PASSWORD: cpi_pass
          POSTGRES_DB: cpi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pip install --upgrade pip
          pip install pytest pytest-asyncio rapidfuzz numpy pandas scipy sqlalchemy statsmodels pendulum python-dotenv boto3 pyarrow psycopg2-binary beautifulsoup4 requests google-genai

      - name: Initialize PostgreSQL Schemas & Stored Procedures
        env:
          PGPASSWORD: cpi_pass
        run: |
          psql -h localhost -p 5432 -U cpi_user -d cpi_db -f sql/schema.sql
          psql -h localhost -p 5432 -U cpi_user -d cpi_db -f sql/gold_procedures.sql
          psql -h localhost -p 5432 -U cpi_user -d cpi_db -f sql/views.sql

      - name: Run Full Pytest Suite
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: cpi_db
          DB_USER: cpi_user
          DB_PASS: cpi_pass
        run: |
          pytest tests/ -v

  # ── 3. dbt Model Compilation, Seeding & Tests ──────────────────────────────
  dbt-validation:
    name: PostgreSQL 16 & dbt Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpi_user
          POSTGRES_PASSWORD: cpi_pass
          POSTGRES_DB: cpi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PostgreSQL Client & dbt
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pip install --upgrade pip
          pip install dbt-core dbt-postgres psycopg2-binary

      - name: Initialize PostgreSQL Schemas & Procedures
        env:
          PGPASSWORD: cpi_pass
        run: |
          psql -h localhost -p 5432 -U cpi_user -d cpi_db -f sql/schema.sql
          psql -h localhost -p 5432 -U cpi_user -d cpi_db -f sql/gold_procedures.sql
          psql -h localhost -p 5432 -U cpi_user -d cpi_db -f sql/views.sql

      - name: Run dbt Pipeline (Deps → Seed → Run Models → Test)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: cpi_db
          DB_USER: cpi_user
          DB_PASS: cpi_pass
        run: |
          dbt deps --project-dir dbt --profiles-dir dbt
          dbt seed --project-dir dbt --profiles-dir dbt --target cpi_target
          dbt run --project-dir dbt --profiles-dir dbt --target cpi_target
          dbt test --project-dir dbt --profiles-dir dbt --target cpi_target

  # ── 4. Docker Compose Syntax & Compose Config Validation ────────────────────
  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "docker-compose.yml configuration is valid."


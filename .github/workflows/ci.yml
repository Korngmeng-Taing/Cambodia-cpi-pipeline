name: Cambodia CPI Pipeline CI/CD

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint & Code Quality ──────────────────────────────────────────────────
  lint:
    name: Lint & Style Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Lint (Syntax & Critical Errors)
        run: |
          ruff check --select=E,F,W --ignore=E501,F401 .

  # ── 2. Unit & Econometric Index Tests ──────────────────────────────────────
  unit-tests:
    name: Pytest Unit & Econometric Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio rapidfuzz numpy pandas scipy sqlalchemy statsmodels pendulum python-dotenv boto3 pyarrow psycopg2-binary beautifulsoup4 requests

      - name: Run Unit & Econometric Tests
        run: |
          pytest tests/test_fisher_calculator.py \
                 tests/test_geks_calculator.py \
                 tests/test_hedonic_regression.py \
                 tests/test_canonical.py \
                 tests/test_pipeline_contracts.py -v

  # ── 3. Database Schema & dbt Compilation ────────────────────────────────────
  dbt-validation:
    name: PostgreSQL 16 & dbt Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpi_user
          POSTGRES_PASSWORD: cpi_pass
          POSTGRES_DB: cpi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PostgreSQL Client & dbt
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pip install --upgrade pip
          pip install dbt-core dbt-postgres psycopg2-binary

      - name: Initialize PostgreSQL Schemas & Procedures
        env:
          PGPASSWORD: cpi_pass
        run: |
          psql -h localhost -p 5432 -U cpi_user -d cpi_db -f sql/schema.sql
          psql -h localhost -p 5432 -U cpi_user -d cpi_db -f sql/gold_procedures.sql
          psql -h localhost -p 5432 -U cpi_user -d cpi_db -f sql/views.sql

      - name: Validate dbt Models & Seeds
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: cpi_db
          DB_USER: cpi_user
          DB_PASS: cpi_pass
          DBT_PROFILES_DIR: ./dbt
        run: |
          cd dbt
          dbt compile --target cpi_target
          dbt seed --target cpi_target

name: Cambodia CPI Pipeline CI/CD

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Fast Quality, DAG Integrity & Scraper Gates (< 30s) ──────────────────
  quality-gate:
    name: Fast Quality, DAG Integrity & Scraper Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Quality Tools & Core Testing Libs
        run: |
          pip install --upgrade pip
          pip install ruff pytest pendulum rapidfuzz requests

      - name: Run Ruff Lint (Syntax & Critical Checks)
        run: |
          ruff check --select=E9,F63,F7,F82,F401,F841 --ignore=E501,EXE002,W292 pipeline scrapers orchestration tests scripts

      - name: Airflow DAG Syntax & Integrity Check
        run: |
          pytest tests/test_airflow_dags.py -v

      - name: Scraper Contract & Schema Compliance Check
        run: |
          pytest tests/test_sources.py tests/test_scrapers.py -v

      - name: Validate Docker Compose Configuration
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi
          docker compose config --quiet
          echo "docker-compose.yml configuration is valid."

  # ── 2. Full Integration Suite (PostgreSQL 16 + pgvector + dbt) ──────────────
  integration-suite:
    name: Database, dbt & CPI Mathematical Axiom Suite
    needs: [quality-gate]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cpi_user
          POSTGRES_PASSWORD: cpi_pass
          POSTGRES_DB: cpi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache dbt Packages
        uses: actions/cache@v4
        with:
          path: dbt/dbt_packages
          key: ${{ runner.os }}-dbt-packages-${{ hashFiles('dbt/packages.yml') }}
          restore-keys: |
            ${{ runner.os }}-dbt-packages-

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov rapidfuzz numpy pandas scipy sqlalchemy statsmodels pendulum python-dotenv psycopg2-binary beautifulsoup4 requests google-genai openpyxl reportlab dbt-core dbt-postgres

      - name: Initialize PostgreSQL Schemas & Tables
        env:
          PGPASSWORD: cpi_pass
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U cpi_user -d cpi_db -f sql/schema.sql

      - name: Run dbt Pipeline (Deps -> Seed -> Run -> Test)
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: cpi_db
          DB_USER: cpi_user
          DB_PASS: cpi_pass
          PGPASSWORD: cpi_pass
        run: |
          dbt deps --project-dir dbt --profiles-dir dbt
          dbt seed --project-dir dbt --profiles-dir dbt --target cpi_target
          dbt run --project-dir dbt --profiles-dir dbt --target cpi_target
          dbt test --project-dir dbt --profiles-dir dbt --target cpi_target
          psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U cpi_user -d cpi_db -f sql/views.sql

      - name: Run Full Pytest Suite with Coverage
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: cpi_db
          DB_USER: cpi_user
          DB_PASS: cpi_pass
        run: |
          pytest tests/ -v

  # ── 3. Academic Artifact Generation & Archive ────────────────────────────────
  build-academic-artifacts:
    name: Build & Archive Thesis PDF and Literature Matrix
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ReportLab & OpenPyXL
        run: |
          pip install reportlab openpyxl pandas

      - name: Generate Literature Review Matrix & PDF Compendium
        run: |
          python scripts/generate_simple_literature_review_excel.py
          python scripts/generate_literature_review_pdf.py

      - name: Upload Thesis Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: cambodia-cpi-academic-compendium
          path: |
            thesis/Cambodia_CPI_Literature_Review.pdf
            thesis/Literature_Review_Matrix.xlsx
            thesis/MACHINE_LEARNING_IN_CPI_GUIDE.md
          if-no-files-found: warn

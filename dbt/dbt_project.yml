name: cpi
version: "1.0.0"
config-version: 2

profile: cpi

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
log-path: "logs"
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

require-dbt-version: [">=1.8.0", "<2.0.0"]

vars:
  base_period: "{{ env_var('BASE_PERIOD', '2026-08') }}"
  ds: ""

models:
  cpi:
    staging:
      +schema: staging
      +materialized: view
    silver:
      +schema: silver
      +materialized: incremental
      intermediate:
        +schema: silver
        +materialized: view
    gold:
      +schema: gold
      +materialized: table

seeds:
  cpi:
    +schema: silver
    +quote_columns: false
    category_weights:
      +schema: gold
      +column_types:
        coicop_division: varchar(16)
        division_name: text
        weight_pct: numeric(6, 3)
        source: text
        effective_date: date
    cambodia_cpi_coicop_weights_breakdown:
      +schema: gold
      +column_types:
        coicop_level: varchar(16)
        coicop_code: varchar(16)
        coicop_name: text
        coicop_name_kh: text
        weight_pct: numeric(6, 3)
        parent_division: varchar(16)
        source: text
    coicop_store_defaults:
      +schema: silver
      +column_types:
        store_slug: varchar(64)
        store_name: text
        source_type: varchar(32)
        channel: varchar(32)
        default_currency: varchar(8)
        default_coicop_division: varchar(16)
        confidence: numeric(5, 4)
        is_active: boolean
    coicop_text_rules:
      +schema: silver
      +column_types:
        rule_id: varchar(32)
        coicop_division: varchar(16)
        pattern: text
        negative_pattern: text
        requires_context_pattern: text
        priority: int
        confidence: numeric(5, 4)
        is_active: boolean
        notes: text
    cpi_basket_v1:
      +schema: silver
      +column_types:
        coicop_class: varchar(16)
        coicop_division: varchar(16)
        class_name: text
        sample_items: text
        expected_source: text
        weight_within_division_pct: numeric(6, 3)
    coicop_override:
      +schema: silver
      +column_types:
        match_type: varchar(32)
        match_value: varchar(255)
        store_slug: varchar(50)
        coicop_division: varchar(10)
        reason: varchar(255)
    coicop_classification_seed:
      +column_types:
        product_name: text
        coicop_code: varchar(16)
        confidence_score: numeric(5, 4)
        reasoning: text
        model_version: varchar(64)
      # Day-0 bootstrap: upsert curated classifications into the real Gemini
      # cache so the ladder's tier 3 resolves high-volume products with zero
      # API calls. ON CONFLICT DO NOTHING = seed never overwrites a fresher
      # Gemini result or human label. Rows carry model_version
      # 'seed_bootstrap_v1' for traceability; '99.9.9' rows are excluded.
      +post-hook:
        - >-
          INSERT INTO silver.dim_coicop_ai_cache
              (product_name, coicop_code, confidence_score, reasoning, model_version)
          SELECT s.product_name, s.coicop_code, s.confidence_score, s.reasoning, s.model_version
          FROM {{ this }} s
          WHERE s.coicop_code IS NOT NULL AND s.coicop_code <> '99.9.9'
          ON CONFLICT (product_name) DO NOTHING
    utility_tariffs:
      +schema: silver

tests:
  cpi:
    +store_failures: false

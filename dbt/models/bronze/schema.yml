version: 2

models:
  - name: stg_hello_world
    description: Connection-check model materialized in the bronze schema. Queried by
      `tests/test_dbt_connection.py` to verify Postgres connectivity from the Airflow stack.
    columns:
      - name: message
        description: Static literal "hello_world"
        tests:
          - not_null
      - name: layer
        description: Static literal "bronze"
        tests:
          - not_null
          - accepted_values:
              values: ["bronze"]
      - name: status
        description: Static literal "connection_verified"
        tests:
          - not_null

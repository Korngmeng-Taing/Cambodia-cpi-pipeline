version: 2

models:
  - name: dim_items
    description: Curated canonical item master dimension — one row per unique product across all stores.
    columns:
      - name: item_id
        tests:
          - not_null
          - unique
      - name: canonical_name
        tests:
          - not_null

  - name: dim_stores
    description: Curated store & source dimension — one row per retailer/service provider in Cambodia.
    columns:
      - name: store_slug
        tests:
          - not_null
          - unique
      - name: store_name
        tests:
          - not_null

  - name: fct_daily_prices
    description: Gold primary daily price fact table — one row per (scrape_date, store_slug, item_id). Contains core price facts, discounts, unit prices, and dimension foreign keys.
    columns:
      - name: item_id
        tests:
          - not_null
      - name: store_slug
        tests:
          - not_null
      - name: scrape_date
        tests:
          - not_null
      - name: price_khr
        tests:
          - not_null



  - name: fct_coicop_class_daily
    description: Intermediate 4-digit COICOP class level aggregate index facts (e.g. 01.1.1 Bread & Cereals).
    columns:
      - name: calculation_date
        tests:
          - not_null
      - name: coicop_code
        tests:
          - not_null
      - name: class_index
        tests:
          - not_null

  - name: vw_aeon_product_divisions
    description: View of AEON multi-category product distribution across COICOP divisions. Includes product names, brands, prices, and division classifications for aeon and aeon3 stores.
    columns:
      - name: item_id
        tests:
          - not_null
      - name: canonical_name
        tests:
          - not_null
      - name: coicop_division
        tests:
          - not_null

  - name: fct_cpi_monthly
    description: Monthly conformed 12-division and national headline/core CPI facts with MoM and YoY inflation rates.
    columns:
      - name: cpi_month
        tests:
          - not_null
      - name: coicop_division
        tests:
          - not_null
      - name: monthly_headline_cpi
        tests:
          - not_null

  - name: cambodia_cpi_coicop_weights_breakdown
    description: Official NIS Cambodia expenditure basket breakdown across 12 Divisions, 29 Groups, and 48 Classes aligned with UN COICOP 2018 standards.
    columns:
      - name: coicop_code
        tests:
          - not_null
          - unique
      - name: coicop_level
        tests:
          - not_null
      - name: weight_pct
        tests:
          - not_null







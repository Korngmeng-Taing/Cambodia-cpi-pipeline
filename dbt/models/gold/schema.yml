version: 2

models:
  - name: dim_items
    description: Curated canonical item master dimension — one row per unique product across all stores.
    columns:
      - name: item_id
        tests:
          - not_null
          - unique
      - name: canonical_name
        tests:
          - not_null

  - name: dim_stores
    description: Curated store & source dimension — one row per retailer/service provider in Cambodia.
    columns:
      - name: store_slug
        tests:
          - not_null
          - unique
      - name: store_name
        tests:
          - not_null

  - name: fct_daily_prices
    description: Gold primary daily price fact table — one row per (scrape_date, store_slug, item_id). Contains core price facts, discounts, unit prices, and dimension foreign keys.
    columns:
      - name: item_id
        tests:
          - not_null
      - name: store_slug
        tests:
          - not_null
      - name: scrape_date
        tests:
          - not_null
      - name: price_khr
        tests:
          - not_null

  # fct_cpi_daily is materialised by pipeline/cpi_calculator.py (not a dbt model),
  # so its range tests live as CHECK constraints on the database table. See:
  #   sql/schema.sql lines 277-300  (chk_fct_cpi_headline_range, chk_fct_cpi_core_range,
  #                                  chk_fct_cpi_division_index_range, chk_fct_cpi_weight_sum)
  # Postgres enforces (50, 500) bounds on headline_cpi and core_cpi — a sanity
  # envelope that catches catastrophic unit-price corruption while leaving room
  # for natural 25%-annual inflation on a 2020-base series.
  - name: fct_cpi_daily
    description: Gold Daily CPI facts — one row per (calculation_date, coicop_division) plus division_index. Range-enforced by PostgreSQL CHECK constraints (see sql/schema.sql).
    columns: []

  - name: vw_aeon_product_divisions
    description: View of AEON multi-category product distribution across COICOP divisions. Includes product names, brands, prices, and division classifications for aeon and aeon3 stores.
    columns:
      - name: item_id
        tests:
          - not_null
      - name: canonical_name
        tests:
          - not_null
      - name: coicop_division
        tests:
          - not_null

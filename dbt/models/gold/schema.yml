version: 2

models:
  - name: dim_items
    description: Curated canonical item master dimension — one row per unique product across all stores.
    columns:
      - name: item_id
        tests:
          - not_null
          - unique
      - name: canonical_name
        tests:
          - not_null

  - name: dim_stores
    description: Curated store & source dimension — one row per retailer/service provider in Cambodia.
    columns:
      - name: store_slug
        tests:
          - not_null
          - unique
      - name: store_name
        tests:
          - not_null

  - name: fct_daily_prices
    description: Gold primary daily price fact table — one row per (scrape_date, store_slug, item_id). Contains core price facts, discounts, unit prices, and dimension foreign keys.
    columns:
      - name: item_id
        tests:
          - not_null
      - name: store_slug
        tests:
          - not_null
      - name: scrape_date
        tests:
          - not_null
      - name: price_khr
        tests:
          - not_null

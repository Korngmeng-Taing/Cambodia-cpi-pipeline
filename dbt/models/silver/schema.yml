version: 2

models:
  - name: int_prices_cleaned
    description: Intermediate price cleaning model (stored in silver schema). Cleans prices, converts USD to KHR, clamps promos, calculates unit prices.
    columns:
      - name: raw_price_id
        description: FK to bronze.raw_prices
        tests:
          - not_null
          - unique
      - name: item_id
        description: Matched canonical item ID from item_matcher
      - name: price_khr
        tests:
          - not_null
      - name: cpi_eligible

  - name: int_coicop_classified
    description: Intermediate COICOP classification ladder resolving division and code per (item_id, store_slug).
    columns:
      - name: coicop_division
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "01"
                  - "02"
                  - "03"
                  - "04"
                  - "05"
                  - "06"
                  - "07"
                  - "08"
                  - "09"
                  - "10"
                  - "11"
                  - "12"
                  - "UNCLASSIFIED"
                  - "REVIEW"
      - name: coicop_method
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "override"
                  - "store_purity"
                  - "store_default"
                  - "gemini_ai"
                  - "gemini_ai_low_conf"
                  - "critical_trap"
                  - "category_map"
                  - "text_rules"
                  - "unclassified"
                  - "review"

  - name: clean_store_prices
    description: Unified Silver store prices observation table — clean, standardized daily appended rows from all stores.
    columns:
      - name: raw_price_id
        tests:
          - not_null
          - unique
      - name: store_slug
        tests:
          - not_null
      - name: scrape_date
        tests:
          - not_null
      - name: price_khr
        description: Price converted to KHR. Must be positive (C2 fix — zero-price rows excluded at query level).
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

unit_tests:
  - name: test_int_prices_cleaned_usd_khr_conversion
    description: "Verify USD prices are properly converted to KHR and positive prices are retained"
    model: int_prices_cleaned
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('bronze', 'raw_prices')
        rows:
          - {raw_price_id: 101, store_id: 'delishop', source_name: 'delishop', item_description_raw: 'Fresh Milk 1L', price: 2.50, currency: 'USD', scraped_at: '2026-08-28 10:00:00', raw_payload: '{"barcode": "123456"}'}
          - {raw_price_id: 102, store_id: 'aeon', source_name: 'aeon', item_description_raw: 'Cambodia Beer 330ml', price: 2800, currency: 'KHR', scraped_at: '2026-08-28 10:00:00', raw_payload: '{}'}
      - input: source('staging', 'exchange_rates')
        rows:
          - {execution_date: '2026-08-28', rate: 4000.0}
      - input: source('silver', 'item_match_log')
        rows:
          - {raw_price_id: 101, item_id: 'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11', match_method: 'barcode', confidence: 1.0}
          - {raw_price_id: 102, item_id: 'b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a12', match_method: 'exact', confidence: 1.0}
    expect:
      rows:
        - {raw_price_id: 101, price_khr: 10000.00, cpi_eligible: true}
        - {raw_price_id: 102, price_khr: 2800.00, cpi_eligible: true}

  - name: test_int_prices_cleaned_promo_clamping
    description: "Verify promo discounts are correctly calculated and clamped when sale price is less than original price"
    model: int_prices_cleaned
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('bronze', 'raw_prices')
        rows:
          - {raw_price_id: 201, store_id: 'chipmong', source_name: 'chipmong', item_description_raw: 'Orange Juice 1L', price: 8.00, currency: 'USD', scraped_at: '2026-08-28 10:00:00', raw_payload: '{"original_price": 10.00, "on_promo": true}'}
          - {raw_price_id: 202, store_id: 'chipmong', source_name: 'chipmong', item_description_raw: 'Apple Juice 1L', price: 9.00, currency: 'USD', scraped_at: '2026-08-28 10:00:00', raw_payload: '{"original_price": 7.00}'}
      - input: source('staging', 'exchange_rates')
        rows:
          - {execution_date: '2026-08-28', rate: 4000.0}
      - input: source('silver', 'item_match_log')
        rows:
          - {raw_price_id: 201, item_id: 'c0eebc99-9c0b-4ef8-bb6d-6bb9bd380a13', match_method: 'exact', confidence: 1.0}
          - {raw_price_id: 202, item_id: 'c0eebc99-9c0b-4ef8-bb6d-6bb9bd380a14', match_method: 'exact', confidence: 1.0}
    expect:
      rows:
        - {raw_price_id: 201, price_khr: 32000.00, original_price_khr: 40000.00, discount_pct: 20.00, on_promo: true}
        - {raw_price_id: 202, price_khr: 36000.00, original_price_khr: 28000.00, discount_pct: 0.00, on_promo: false}

  - name: test_int_prices_cleaned_pack_size_parsing
    description: "Verify regex extraction of multi-pack and metric unit package sizes"
    model: int_prices_cleaned
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('bronze', 'raw_prices')
        rows:
          - {raw_price_id: 301, store_id: 'aeon', source_name: 'aeon', item_description_raw: 'Mineral Water 2 x 500ml', price: 4000, currency: 'KHR', scraped_at: '2026-08-28 10:00:00', raw_payload: '{"package_size": "2 x 500ml"}'}
          - {raw_price_id: 302, store_id: 'aeon', source_name: 'aeon', item_description_raw: 'Jasmine Rice 1.5 kg', price: 6000, currency: 'KHR', scraped_at: '2026-08-28 10:00:00', raw_payload: '{"package_size": "1.5 kg"}'}
      - input: source('staging', 'exchange_rates')
        rows:
          - {execution_date: '2026-08-28', rate: 4000.0}
      - input: source('silver', 'item_match_log')
        rows:
          - {raw_price_id: 301, item_id: 'd0eebc99-9c0b-4ef8-bb6d-6bb9bd380a15', match_method: 'exact', confidence: 1.0}
          - {raw_price_id: 302, item_id: 'd0eebc99-9c0b-4ef8-bb6d-6bb9bd380a16', match_method: 'exact', confidence: 1.0}
    expect:
      rows:
        - {raw_price_id: 301, pack_qty: 2, size_value: 500, size_unit: 'ml'}
        - {raw_price_id: 302, pack_qty: 1, size_value: 1.5, size_unit: 'kg'}



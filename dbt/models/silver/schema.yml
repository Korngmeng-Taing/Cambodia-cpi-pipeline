version: 2

models:
  - name: int_prices_cleaned
    description: Intermediate price cleaning model (stored in staging schema). Cleans prices, converts USD to KHR, clamps promos, calculates unit prices.
    columns:
      - name: raw_price_id
        description: FK to bronze.raw_prices
        tests:
          - not_null
          - unique
      - name: item_id
        description: Matched canonical item ID from item_matcher
      - name: price_khr
        tests:
          - not_null
      - name: cpi_eligible

  - name: int_coicop_classified
    description: Intermediate COICOP classification ladder resolving division and code per (item_id, store_slug).
    columns:
      - name: coicop_division
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "01"
                  - "02"
                  - "03"
                  - "04"
                  - "05"
                  - "06"
                  - "07"
                  - "08"
                  - "09"
                  - "10"
                  - "11"
                  - "12"
                  - "UNCLASSIFIED"
                  - "REVIEW"
      - name: coicop_method
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "override"
                  - "store_purity"
                  - "store_default"
                  - "gemini_ai"
                  - "gemini_ai_low_conf"
                  - "category_map"
                  - "unclassified"

  - name: clean_store_prices
    description: Unified Silver store prices observation table — clean, standardized daily appended rows from all stores.
    columns:
      - name: raw_price_id
        tests:
          - not_null
          - unique
      - name: store_slug
        tests:
          - not_null
      - name: scrape_date
        tests:
          - not_null
      - name: price_khr
        description: Price converted to KHR. Must be positive (C2 fix — zero-price rows excluded at query level).
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"

  - name: classification_queue
    description: Operational triage queue capturing unclassified items for Gemini AI batch processing or manual tagging.
    columns:
      - name: product_key
        tests:
          - not_null
      - name: store_slug
        tests:
          - not_null
      - name: status
        tests:
          - not_null

version: 2

sources:
  - name: silver
    schema: silver
    description: |
      Silver layer tables. Canonical identity + classification lookup tables are
      Python-managed (pipeline/item_matcher.py, pipeline/canonicalizer.py,
      pipeline/migrations/006_coicop_classification.sql).
    tables:
      - name: canonical_items
        description: Canonical product identity (ItemMatcher path). View excludes USER-DEFINED embedding column.
        relation_type: view
      - name: item_match_log
        description: Full audit trail of raw-price -> canonical item matches.
      - name: dim_canonical_products
        description: Canonical products created by the canonicalizer (dim_canonical_products).
      - name: hedonic_adjusted_prices
        description: Quality-adjusted constant-specification prices for Division 09/08 electronics.
      - name: dim_coicop_ai_cache
        description: Gemini AI classification result cache.
      - name: coicop_category_map
        description: Store native category -> COICOP division mapping.
      - name: coicop_override_manual
        description: Manual COICOP overrides (kept separate from the dbt-owned coicop_override seed table).
      - name: classification_queue
        description: Operational triage queue for unclassified items.
      - name: classification_cache
        description: Cached final hybrid ladder COICOP classifications.

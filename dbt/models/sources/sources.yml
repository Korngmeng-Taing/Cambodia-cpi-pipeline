version: 2

sources:
  - name: staging
    schema: staging
    description: |
      Bronze ingestion layer (PostgreSQL). Populated by pipeline/bronze_ingestion.py:
      raw JSONB payload batches, the MEF USD/KHR exchange rate, and per-source
      validation stats.
    tables:
      - name: raw_scrapes
        description: Append-only per-source batches (payload JSONB array of canonical records).
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
      - name: exchange_rates
        description: MEF USD/KHR official daily rate (+ fallback audit).
        loaded_at_field: fetched_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
      - name: bronze_ingestion_stats
        description: Per-source parquet snapshot validation stats.
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}

  - name: gold
    schema: gold
    description: Gold layer calculated facts (Jevons micro-indices and Laspeyres CPI facts).
    tables:
      - name: fct_elementary_indices
        description: Jevons micro-indices calculated daily by pipeline/cpi_calculator.py.
      - name: fct_cpi_daily
        description: Daily 12-division Laspeyres and Headline/Core CPI facts.
      - name: fct_cpi_monthly
        description: Monthly conformed 12-division and national headline/core CPI facts calculated by pipeline/cpi_calculator.py.
      - name: dim_nis_official_cpi
        description: Official National Institute of Statistics (NIS) monthly benchmark CPI releases including headline, core, and all 12 COICOP divisions.
        columns:
          - name: cpi_month
            description: Calendar month of the official NIS CPI release.
          - name: headline_cpi
            description: Official NIS Headline CPI index (Base Oct-Dec 2006 = 100).
          - name: core_cpi
            description: Official NIS Core CPI index (excluding food, housing utilities, and transport fuels).
          - name: mom_inflation_pct
            description: Official Month-over-Month inflation percentage.
          - name: yoy_inflation_pct
            description: Official Year-over-Year inflation percentage.
          - name: cpi_division_01
            description: Division 01 Food & Non-Alcoholic Beverages index.
          - name: cpi_division_02
            description: Division 02 Alcoholic Beverages & Tobacco index.
          - name: cpi_division_03
            description: Division 03 Clothing & Footwear index.
          - name: cpi_division_04
            description: Division 04 Housing, Water, Electricity, Gas & Fuels index.
          - name: cpi_division_05
            description: Division 05 Furnishings & Routine Household Maintenance index.
          - name: cpi_division_06
            description: Division 06 Health index.
          - name: cpi_division_07
            description: Division 07 Transport index.
          - name: cpi_division_08
            description: Division 08 Communication index.
          - name: cpi_division_09
            description: Division 09 Recreation & Culture index.
          - name: cpi_division_10
            description: Division 10 Education index.
          - name: cpi_division_11
            description: Division 11 Restaurants & Hotels index.
          - name: cpi_division_12
            description: Division 12 Miscellaneous Goods & Services index.




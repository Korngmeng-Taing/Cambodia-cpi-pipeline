cpi:
  target: cpi_target
  outputs:
    cpi_target:
      type: postgres
      host: "{{ env_var('DB_HOST', 'postgres') }}"
      port: 5432
      user: "{{ env_var('DB_USER') }}"
      # No default: dbt fails fast with a clear error when DB_PASS is unset.
      password: "{{ env_var('DB_PASS') }}"
      dbname: "{{ env_var('DB_NAME', 'cpi_db') }}"
      schema: "{{ env_var('DB_SCHEMA', 'public') }}"
      threads: 4
      keepalives_idle: 0

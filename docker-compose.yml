# =============================================================================
# CAMBODIA CPI PIPELINE — MEDALLION ARCHITECTURE STACK
# PostgreSQL 16 (Bronze / Silver / Gold) + Airflow 2.9.3 + dbt + Metabase
# =============================================================================

x-logging-common: &logging-common
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"

x-airflow-common: &airflow-common
  image: cpi-airflow:2.9.3
  <<: *logging-common
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL:-postgresql+psycopg2://airflow:airflow@postgres:5432/airflow}
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: "true"
    # Cryptographic secrets — uses .env if set, with secure default fallbacks for CI/dev
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-YlCImzjge_TeZc7jPJ7Jz2pgFJlFKMGFB7DkzCpjwBc=}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-cpi_pipeline_airflow_secret_key_2026_secure}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "300"
    AIRFLOW__CORE__DAG_FILE_PROCESSOR_TIMEOUT: "300"
    AIRFLOW__CORE__MIN_FILE_PROCESS_INTERVAL: "30"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "6"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "300"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    PYTHONPATH: /opt/airflow:/opt/airflow/dags
    
    # CPI Application Database Connection
    CPI_DATABASE_URL: ${CPI_DATABASE_URL:-postgresql+psycopg2://cpi_user:cpi_pass@postgres:5432/cpi_db}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    CPI_DB_NAME: cpi_db
    CPI_DB_USER: cpi_user
    CPI_DB_PASSWORD: ${CPI_DB_PASSWORD:-cpi_pass}

    # dbt Environment Variables
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: cpi_db
    DB_USER: cpi_user
    DB_PASS: ${DB_PASS:-cpi_pass}
    DBT_PROFILES_DIR: /opt/airflow/dbt

    # Pipeline Constants & Tokens
    BASE_PERIOD: ${BASE_PERIOD:-2026-08}
    DEFAULT_USD_KHR_RATE: ${DEFAULT_USD_KHR_RATE:-4044}
    MEF_FX_API_URL: ${MEF_FX_API_URL:-https://data.mef.gov.kh/api/v1/realtime-api/exchange-rate}
    VIREAKBUNTHAM_BEARER_TOKEN: ${VIREAKBUNTHAM_BEARER_TOKEN:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    GEMINI_MAX_ITEMS_PER_RUN: ${GEMINI_MAX_ITEMS_PER_RUN:-1000}
    GEMINI_MAX_PRODUCTS_PER_RUN: ${GEMINI_MAX_PRODUCTS_PER_RUN:-1000}
    USE_LOCAL_FALLBACK_FIRST: ${USE_LOCAL_FALLBACK_FIRST:-true}
    AEON_MAX_PAGES: ${AEON_MAX_PAGES:-0}
    CPI_COLD_STORAGE_DIR: ${CPI_COLD_STORAGE_DIR:-/opt/airflow/data/cold_storage}
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./orchestration/logs:/opt/airflow/logs
    - ./orchestration/plugins:/opt/airflow/plugins
    - ./orchestration/config:/opt/airflow/config
    - ./pipeline:/opt/airflow/pipeline
    - ./scrapers:/opt/airflow/scrapers
    - ./sql:/opt/airflow/sql
    - ./tests:/opt/airflow/tests
    - ./scripts:/opt/airflow/scripts
    - ./dbt:/opt/airflow/dbt
    - ./ml:/opt/airflow/ml
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - cpi-net

services:
  # ── PostgreSQL 16 with pgvector (Core Warehouse with Bronze, Silver, Gold Schemas) ─
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    shm_size: 1g
    <<: *logging-common
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      # Loopback-only by default; expose LAN via .env if ever needed.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
      - ./sql:/sql
    deploy:
      resources:
        limits:
          memory: 4096M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cpi-net

  # ── Airflow Database Initializer ─────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    build:
      context: ./orchestration
      dockerfile: Dockerfile
    container_name: airflow-init
    entrypoint: /bin/bash
    command: >
      -c "
        airflow db migrate &&
        airflow users create --username '${AIRFLOW_ADMIN_USER:?Set AIRFLOW_ADMIN_USER in .env}' --password '${AIRFLOW_ADMIN_PASSWORD:?Set a strong AIRFLOW_ADMIN_PASSWORD in .env}' --firstname Admin --lastname User --role Admin --email admin@cpi.local || true &&
        dbt seed --project-dir /opt/airflow/dbt --profiles-dir /opt/airflow/dbt || true
      "
    restart: "no"

  # ── Airflow Webserver UI ─────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    build:
      context: ./orchestration
      dockerfile: Dockerfile
    container_name: airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8080:8080"
      - "8085:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2048M
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Airflow Scheduler ────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    build:
      context: ./orchestration
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    restart: unless-stopped
    command: scheduler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 3072M
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── dbt CLI Service ──────────────────────────────────────────────────────────
  dbt:
    <<: *airflow-common
    build:
      context: ./orchestration
      dockerfile: Dockerfile
    container_name: cpi-dbt
    profiles: ["cli"]
    working_dir: /opt/airflow/dbt
    entrypoint: ["dbt"]
    restart: "no"

  # ── Metabase (Business Intelligence & Dashboards) ────────────────────────────
  metabase:
    image: metabase/metabase:v0.49.13
    container_name: metabase
    restart: unless-stopped
    <<: *logging-common
    ports:
      - "${METABASE_PORT:-3001}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${MB_DB_PASS:-metabase}
      MB_DB_HOST: postgres
    deploy:
      resources:
        limits:
          memory: 2048M
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cpi-net

# =============================================================================
# Networks & Volumes
# =============================================================================
networks:
  cpi-net:
    driver: bridge

volumes:
  postgres-data:

# =============================================================================
# CAMBODIA CPI PIPELINE — MEDALLION ARCHITECTURE STACK
# PostgreSQL 16 (Bronze / Silver / Gold) + MinIO Object Storage + Airflow 2.9.3 + dbt + Metabase
# =============================================================================

x-airflow-common: &airflow-common
  image: cpi-airflow:2.9.3-simple
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL:-postgresql+psycopg2://airflow:airflow@postgres:5432/airflow}
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-YlCImzjge_TeZc7jPJ7Jz2pgFJlFKMGFB7DkzCpjwBc=}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-cpi_pipeline_airflow_secret_key_2026_secure}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "8"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "6"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    PYTHONPATH: /opt/airflow:/opt/airflow/dags
    
    # CPI Application Database Connection
    CPI_DATABASE_URL: ${CPI_DATABASE_URL:-postgresql+psycopg2://cpi_user:cpi_pass@postgres:5432/cpi_db}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    CPI_DB_NAME: cpi_db
    CPI_DB_USER: cpi_user
    CPI_DB_PASSWORD: cpi_pass

    # dbt Environment Variables
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: cpi_db
    DB_USER: cpi_user
    DB_PASS: cpi_pass
    DBT_PROFILES_DIR: /opt/airflow/dbt

    # MinIO / S3 Object Storage
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    MINIO_BUCKET: ${MINIO_BUCKET:-cpi-bronze}

    # Pipeline Constants & Tokens
    BASE_PERIOD: ${BASE_PERIOD:-2026-08}
    DEFAULT_USD_KHR_RATE: ${DEFAULT_USD_KHR_RATE:-4044}
    MEF_FX_API_URL: ${MEF_FX_API_URL:-https://data.mef.gov.kh/api/v1/realtime-api/exchange-rate}
    VIREAKBUNTHAM_BEARER_TOKEN: ${VIREAKBUNTHAM_BEARER_TOKEN:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
  volumes:
    - ./orchestration/dags:/opt/airflow/dags
    - ./orchestration/logs:/opt/airflow/logs
    - ./orchestration/plugins:/opt/airflow/plugins
    - ./orchestration/config:/opt/airflow/config
    - ./pipeline:/opt/airflow/pipeline
    - ./scrapers:/opt/airflow/scrapers
    - ./sql:/opt/airflow/sql
    - ./tests:/opt/airflow/tests
    - ./dbt:/opt/airflow/dbt
    - ./models:/opt/airflow/models
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_started
  networks:
    - cpi-net

services:
  # ── PostgreSQL 16 (Core Warehouse with Bronze, Silver, Gold Schemas) ───────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
      - ./sql:/sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cpi-net

  # ── MinIO (S3-Compatible Object Storage for Raw Scrapes & Cold Parquet) ────
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cpi-net

  # ── MinIO Bucket Auto-Initializer ──────────────────────────────────────────
  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/cpi-bronze || true;
      /usr/bin/mc anonymous set download myminio/cpi-bronze || true;
      exit 0;
      "
    networks:
      - cpi-net

  # ── Airflow Database Initializer ─────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    build:
      context: ./orchestration
      dockerfile: Dockerfile
    container_name: airflow-init
    entrypoint: /bin/bash
    command: >
      -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@cpi.local || true
      "
    restart: "no"

  # ── Airflow Webserver UI ─────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    build:
      context: ./orchestration
      dockerfile: Dockerfile
    container_name: airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8085:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Airflow Scheduler ────────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    build:
      context: ./orchestration
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── dbt CLI Service ──────────────────────────────────────────────────────────
  dbt:
    <<: *airflow-common
    build:
      context: ./orchestration
      dockerfile: Dockerfile
    container_name: cpi-dbt
    working_dir: /opt/airflow/dbt
    entrypoint: ["dbt"]
    restart: "no"

  # ── Metabase (Business Intelligence & Dashboards) ────────────────────────────
  metabase:
    image: metabase/metabase:v0.49.13
    container_name: metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cpi-net

# =============================================================================
# Networks & Volumes
# =============================================================================
networks:
  cpi-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:

[project]
name = "cambodia-cpi-pipeline"
version = "0.1.0"
description = "Consumer Price Index (CPI) computation pipeline using a Medallion Architecture"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CPI Engineering Team", email = "cpi@example.com" }
]
dependencies = [
    "dbt-core>=1.8.0",
    "dbt-postgres>=1.8.0",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "rapidfuzz>=3.6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "playwright>=1.42.0",
    "pendulum>=3.0.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "cambodia-cpi-pipeline"
version = "0.1.0"
description = "Consumer Price Index (CPI) computation pipeline using a Medallion Architecture"
authors = ["CPI Engineering Team <cpi@example.com>"]
readme = "README.md"
packages = [
    { include = "scrapers" },
    { include = "pipeline" },
    { include = "orchestration" }
]

[tool.poetry.dependencies]
python = "^3.11"
dbt-core = "^1.8.0"
dbt-postgres = "^1.8.0"
psycopg2-binary = "^2.9.9"
pandas = "^2.2.0"
numpy = "^1.26.0"
scipy = "^1.12.0"
rapidfuzz = "^3.6.0"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.3"
playwright = "^1.42.0"
pendulum = "^3.0.0"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.0"
statsmodels = "^0.14.0"
scikit-learn = "^1.4.0"
joblib = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.5"
black = "^24.3.0"
ruff = "^0.4.0"
sqlfmt = { extras = ["jinjafmt"], version = "^0.21.1" }
pre-commit = "^3.7.0"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | dbt_packages
  | target
  | logs
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "dbt_packages",
    "target",
    "logs",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501", "EXE002"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v -ra -q"
pythonpath = ["."]
testpaths = [
    "tests"
]
python_files = ["test_*.py"]
